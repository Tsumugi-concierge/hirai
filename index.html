<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2faf0">
  <title>Welcome to Hirai / Maison de cinq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">

<body>
<main>
  <section class="hero">

    <h1>Hirai</h1>
    <p>Maison de cinq 2F / 3F</p>
  </section>

  <section class="notice" aria-label="Property information">

    <p>〒132-0035 東京都江戸川区平井5丁目58-2<br>Maison de cinq 2・3F</p>

  <nav class="menu" aria-label="Guest menu">
    <div class="menu-group">
      <div class="menu-group-head">
        <span class="menu-group-title">Arriving</span>
        <span class="menu-group-line"></span>
      </div>
      <div class="btn-grid">
        <a href="access/" class="pl-btn">
          <span class="pl-icon-wrap"><span class="pl-icon" aria-hidden="true">📍</span></span>

    <div class="menu-group">
      <div class="menu-group-head">
        <span class="menu-group-title">Inside the Home</span>
        <span class="menu-group-line"></span>

      <div class="btn-grid">
        <a href="house-rules/" class="pl-btn">
          <span class="pl-icon-wrap"><span class="pl-icon" aria-hidden="true">📋</span></span>
          <span class="pl-en">House Rules</span>
          <span class="pl-ja">ハウスルール</span>
        </a>
        <a href="emergency/" class="pl-btn">
          <span class="pl-icon-wrap"><span class="pl-icon" aria-hidden="true">📞</span></span>

    </div>
